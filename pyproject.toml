[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nyx-showcase"
version = "0.1.0"
description = "Sanitized portfolio edition of an offline-first security triage project."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Amethyst Assurance Group" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Security",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
nyx-showcase = "nyx_showcase.cli:main"

[tool.setuptools.packages.find]
include = ["nyx_showcase*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"

